# What the GOO session does when nobody touches it (hypridle, started by latte-idle.service). A film, a game
# or a call that asks for the screen to stay on is obeyed, and so is a window that fills the screen.

general {
    # `loginctl lock-session` and the timeout below both come here; the Goo scene is the lock screen
    lock_cmd = pleamar --say goo "emit lock_now"
    before_sleep_cmd = pleamar --say goo "emit lock_now"
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    inhibit_sleep = 3                       # the machine does not sleep until the lock is on the screen
}

# The drops go by the whole system, keys included: asleep after a minute, weather after three, play after six.
listener {
    timeout = 60
    on-timeout = latte-say "emit sys_idle 1"
    on-resume = latte-say "emit sys_idle 0"
}
listener {
    timeout = 180
    on-timeout = latte-say "emit sys_idle 2"
}
listener {
    timeout = 360
    on-timeout = latte-say "emit sys_idle 3"
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
