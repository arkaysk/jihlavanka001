# pleamar-wm in the LatteOS session; ~/.config/latteos/pleamar-wm/session.conf replaces this file.
# What this does not say (the monitors) comes from ~/.config/hypr.
layout * leader
# ponytail: every Quickshell window floats, apps too, since a widget can only be told by its command line; upgrade: a title or app_id of their own for widgets
window app=org.quickshell float frame=own
