# latteos-base — jeden zoznam balíkov pre všetky stroje (roadmapa, bod H.1).
#
# Zásada 8: ovládače a firmvér sa nedopĺňajú až vtedy, keď používateľ zistí, že mu niečo nefunguje.
# Preto je zoznam rovnaký pre každý počítač: firmvér pre grafiku Radeon aj GeForce, pre Wi-Fi Intel
# aj Realtek sa inštaluje všade, lebo stojí desiatky megabajtov a ušetrí „nefunguje mi sieť“.
#
# „Najnovšie“ znamená najnovšie stabilné. Nič sa neinštaluje potajomky: balíky z cudzích repozitárov
# (RPM Fusion) sú v `optional` a inštalujú sa len s výslovným súhlasom (bod H.7).
#
# Názvy sú overené proti `dnf repoquery` na Fedore 44. Kontrola stavu: `latte-devices base`.
#
# Kľúče skupiny:
#   id          stabilné id, na ktoré sa odkazuje hwstatus.py pri hľadaní chýbajúceho balíka
#   devices     skupiny zariadení zo Správcu zariadení (hardware.GROUPS), ktorých sa skupina týka
#   required    balíky metabalíka: inštalujú sa na každom stroji
#   optional    balíky, ktoré sa ponúknu (cudzí repozitár, proprietárne, len istý hardvér)

[base]
id = "latteos-base"
title = "Základ LatteOS"
note = "Metabalík: po inštalácii má fungovať 3D grafika, zvuk, sieť, vstupné zariadenia a tlač."

# ------------------------------------------------------------------ cudzie repozitáre
# LatteOS ich podporuje, ale nezapína. Zostávajú otvorenou cestou pre stroj, ktorý ich naozaj
# potrebuje (`release` a `url` hovoria, čím sa repozitár zapne — použije to bod H.7).
# Steam sem nepatrí: ide cez Flatpak z Flathubu, takže kvôli nemu netreba zapínať nič.
[repo.rpmfusion-free]
title = "RPM Fusion Free"
release = "rpmfusion-free-release"
url = "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$releasever.noarch.rpm"
note = """Slobodné kodeky a ovládače, ktoré Fedora nebalí pre patenty (VA-API pre AMD a Intel).
Balíky *-freeworld nahrádzajú fedorovské (`dnf swap`), takže zmenia, čo je v systéme už nainštalované."""
[repo.rpmfusion-nonfree]
title = "RPM Fusion Nonfree"
release = "rpmfusion-nonfree-release"
url = "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$releasever.noarch.rpm"
note = """Proprietárny ovládač NVIDIA a Wi-Fi Broadcom. Čo treba povedať dopredu, než sa zapne:
akmod-nvidia sa prekladá znova pri každej aktualizácii jadra a ak sa preklad nestihne alebo zlyhá,
počítač po reštarte nabehne bez ovládača; pri Secure Boote treba modul podpísať vlastným kľúčom (MOK),
čo si vyžiada reštart a potvrdenie vo firmvéri; Fedora tento repozitár nepodporuje a jeho balíky
sa nesmú šíriť v ISO obraze."""

# ------------------------------------------------------------------ skupiny
[[group]]
id = "firmware"
title = "Firmvér zariadení"
devices = ["computer", "platform"]
why = "Bez firmvéru mlčí Wi-Fi, Bluetooth aj zvuková karta, hoci ovládač v jadre je."
required = [
    "linux-firmware",
    "amd-ucode-firmware", "amd-gpu-firmware", "intel-gpu-firmware", "nvidia-gpu-firmware",
    "intel-audio-firmware", "cirrus-audio-firmware", "alsa-sof-firmware",
    "iwlwifi-dvm-firmware", "iwlwifi-mvm-firmware", "iwlwifi-mld-firmware", "iwlbluetooth-firmware",
    "atheros-firmware", "brcmfmac-firmware", "realtek-firmware", "mt7xxx-firmware",
    "nxpwireless-firmware", "tiwilink-firmware", "libertas-firmware", "qcom-wwan-firmware",
]
optional = ["alsa-firmware"]

[[group]]
id = "graphics"
title = "Grafika a 3D"
devices = ["graphics", "display"]
why = "3D, Vulkan a hardvérové dekódovanie videa. Bez 32-bitových ovládačov nepobeží veľa hier."
required = ["mesa-dri-drivers", "mesa-vulkan-drivers", "mesa-libEGL", "mesa-libGL", "vulkan-loader", "libva"]
optional = ["mesa-vulkan-drivers.i686", "mesa-dri-drivers.i686", "vulkan-tools", "libva-utils"]
[[group.extra]]
repo = "rpmfusion-free"
packages = ["mesa-va-drivers-freeworld"]
note = "Hardvérové dekódovanie videa na Radeone a Intele (Fedora ho pre patenty nebalí)."
[[group.extra]]
repo = "rpmfusion-nonfree"
packages = ["akmod-nvidia", "xorg-x11-drv-nvidia-cuda"]
note = "Proprietárny ovládač GeForce, stabilná vetva. Len na stroji s kartou NVIDIA."

[[group]]
id = "audio"
title = "Zvuk"
devices = ["audio"]
why = "PipeWire nahrádza PulseAudio aj JACK; alsa-ucm vie, ako je zapojený zvuk notebooku."
required = ["pipewire", "pipewire-alsa", "pipewire-pulseaudio", "wireplumber", "alsa-ucm", "alsa-lib"]
optional = ["pipewire-jack-audio-connection-kit"]

[[group]]
id = "input"
title = "Vstupné zariadenia"
devices = ["input"]
why = "Klávesnice, touchpady a gamepady rieši libinput; tablety potrebujú svoju databázu."
required = ["libinput", "libwacom", "libwacom-data"]
optional = ["fprintd", "libfprint"]

[[group]]
id = "network"
title = "Sieť"
devices = ["network", "connection", "vpn"]
why = "Wi-Fi, mobilná sieť a VPN cez NetworkManager; firmvér kariet je v skupine Firmvér."
required = ["NetworkManager", "NetworkManager-wifi", "NetworkManager-wwan", "wpa_supplicant"]
optional = ["NetworkManager-openvpn", "NetworkManager-vpnc"]
[[group.extra]]
repo = "rpmfusion-nonfree"
packages = ["broadcom-wl"]
note = "Wi-Fi Broadcom v starších notebookoch. Fedora preň ovládač nemá, slobodná náhrada nestačí."
# WireGuard vie NetworkManager sám, samostatný balík neexistuje.

[[group]]
id = "bluetooth"
title = "Bluetooth"
devices = ["bluetooth"]
why = "Bez bluez nie je adaptér vidieť, aj keď jadro zariadenie pozná."
required = ["bluez", "bluez-obexd", "NetworkManager-bluetooth"]

[[group]]
id = "print"
title = "Tlač a skenovanie"
devices = ["usb"]
why = "Sieťové aj USB tlačiarne cez CUPS; ipp-usb a sane-airscan zvládnu moderné zariadenia bez ovládača."
required = ["cups", "cups-filters", "ipp-usb"]
optional = ["sane-airscan", "simple-scan", "gutenprint", "system-config-printer"]

[[group]]
id = "storage"
title = "Disky a médiá"
devices = ["storage", "optical"]
why = "Pripájanie diskov bez roota (udisks2) a modul disketovej mechaniky."
required = ["udisks2", "polkit"]
optional = ["kernel-modules-extra", "udisks2-btrfs", "udisks2-lvm2"]

[[group]]
id = "power"
title = "Napájanie a teploty"
devices = ["power"]
why = "Profily napájania (bod 8.12) a ochrana pred prehriatím."
required = ["upower", "power-profiles-daemon"]
optional = ["thermald", "tuned"]

[[group]]
id = "portal"
title = "Portály a aplikácie"
devices = []
why = "Systémové dialógy, vzhľad a Flatpak. Bez portálu nemá cudzia aplikácia ako sa spýtať systému."
required = ["xdg-desktop-portal", "xdg-desktop-portal-gtk", "flatpak"]
optional = ["xdg-desktop-portal-wlr"]

[[group]]
id = "update"
title = "Firmvér a identifikácia"
devices = ["platform", "computer"]
why = "fwupd aktualizuje firmvér zariadení; hwdata a pciutils dávajú mená hardvéru aj bez siete."
required = ["fwupd", "hwdata", "pciutils", "usbutils"]

[[group]]
id = "session"
title = "Prostredie LatteOS"
devices = []
why = "Bez týchto balíkov sa relácia nespustí. Patria do metabalíka, nie sú voliteľné."
required = ["labwc", "gtk4", "gtk4-layer-shell", "python3-gobject", "greetd", "gtkgreet", "foot"]
optional = ["greetd-selinux", "ffmpegthumbnailer"]
