# Schéma domény „appearance“ (Prispôsobenie). Súbor používateľa: ~/.config/latteos/appearance.toml
# Formát schém a pravidlá sú v docs/nastavenia.md.

[domain]
id = "appearance"
title = "Prispôsobenie"
description = "Vzhľad celého prostredia: farby, motív, písmo, tapeta. Zmena sa prejaví hneď."
file = "appearance.toml"
owner = "latte-appearance"
scope = "user"

[section.theme]
title = "Motív"
[section.color]
title = "Farby"
[section.shape]
title = "Tvar"
[section.font]
title = "Písmo"
[section.window]
title = "Okná"
[section.accessibility]
title = "Zjednodušenie ovládania"
[section.wallpaper]
title = "Pozadie"
[section.integration]
title = "Integrácia aplikácií"
[section.bar]
title = "Vzhľad lišty"
[section.bars]
title = "Rohové dlaždice lišty"

[key."theme.id"]
type = "string"
default = "latte"
label = "Motív"
description = "Balík farieb a tvarov z data/themes/. Neznámy motív sa nahradí predvoleným."

[key."color.scheme"]
type = "enum"
choices = ["dark", "light"]
labels = ["Tmavý", "Svetlý"]
default = "dark"
label = "Farebný režim"
description = "Tmavý alebo svetlý variant motívu. Prenáša sa aj do aplikácií, ktoré sa riadia portálom."

[key."color.accent"]
type = "color"
default = ""
allow_empty = true
label = "Farba zvýraznenia"
description = "Prázdne = farba motívu."

[key."color.transparency"]
type = "bool"
default = true
label = "Efekty priehľadnosti"
description = "Polopriehľadné panely a lišta. Vypnutie ich urobí plnofarebnými."

[key."shape.corners"]
type = "enum"
choices = ["round", "square"]
labels = ["Zaoblené", "Ostré"]
default = "round"
label = "Rohy"

[key."font.family"]
type = "string"
default = ""
allow_empty = true
label = "Písmo"
description = "Prázdne = systémové písmo."

[key."font.scale"]
type = "float"
default = 1.0
min = 0.8
max = 1.6
step = 0.05
label = "Veľkosť textu"

[key."window.buttons"]
type = "enum"
choices = ["all", "minimize-close", "close"]
labels = ["Všetky", "Minimalizovať a zavrieť", "Iba zavrieť"]
default = "all"
label = "Tlačidlá v záhlaví okna"
description = "Ktoré tlačidlá majú okná aplikácií (minimalizovať, maximalizovať, zavrieť)."

[key."window.titlebar"]
type = "int"
default = 46
min = 46
max = 64
step = 2
unit = "px"
label = "Výška záhlavia okien"
description = "Hrúbka horného pruhu všetkých okien: komponentov LatteOS, aplikácií GTK4 a libadwaita aj rámu, ktorý kreslí kompozitor."

[key."bar.height"]
type = "int"
default = 84
min = 48
max = 96
step = 2
unit = "px"
control = "slider"
label = "Výška lišty"
description = "Výška dolnej lišty a jej rohových dlaždíc. Okná sa hneď prispôsobia zvyšnému miestu obrazovky."

# Rohové dlaždice (App Manager vľavo, Správca zariadení vpravo): zdroj je zápis z latte_common/scenes.py
# (solid:motív | scene:matrix | scene:gears | scene:glow | solid:#RRGGBB); Nastavenia ponúkajú výber s náhľadom.
[key."bars.left"]
type = "string"
default = "scene:matrix"
label = "Ľavý roh (App Manager)"
description = "Čo sa pohybuje v rohovej dlaždici a v ramene popupu nad ňou."

[key."bars.right"]
type = "string"
default = "scene:gears"
label = "Pravý roh (Správca zariadení)"
description = "Čo sa pohybuje v rohovej dlaždici a v ramene popupu nad ňou."

[key."bars.motion"]
type = "enum"
choices = ["always", "hover", "off"]
labels = ["Vždy", "Len pod kurzorom", "Vypnutý"]
default = "always"
label = "Pohyb"
description = "Kedy sa textúra hýbe. Vypnutý pohyb (alebo vypnuté animácie v systéme) ukáže statický obraz."

[key."bars.speed"]
type = "float"
default = 1.0
min = 0.25
max = 1.5
step = 0.05
control = "slider"
label = "Rýchlosť pohybu"
description = "Menej je pokojnejšie."

[key."bars.dim"]
type = "float"
default = 0.6
min = 0.0
max = 0.9
step = 0.05
control = "slider"
label = "Stlmenie pod textom"
description = "Ako veľmi sa textúra stmaví pod písmom, aby bolo čitateľné."

[key."accessibility.contrast"]
type = "enum"
choices = ["normal", "high"]
labels = ["Normálny", "Vysoký"]
default = "normal"
label = "Kontrast"

[key."wallpaper.path"]
type = "path"
default = ""
allow_empty = true
label = "Obrázok pozadia"
description = "Prázdne = systémová tapeta motívu."

[key."wallpaper.fit"]
type = "enum"
choices = ["cover", "contain", "fill"]
labels = ["Vyplniť", "Vmestiť", "Roztiahnuť"]
default = "cover"
label = "Prispôsobenie obrázka"

[key."integration.gtk"]
type = "bool"
default = true
label = "Zosúladiť GTK aplikácie"
description = "Spravovaný gtk.css a settings.ini pre GTK 3, GTK 4 a libadwaita aplikácie."

[key."integration.qt"]
type = "bool"
default = true
label = "Zosúladiť Qt a KDE aplikácie"
description = "Farebná schéma LatteOS pre Qt/KDE aplikácie, napríklad Gwenview, Dolphin, Kate a Okular."
