# Motív LatteOS: teplá káva, krémová, karamel. Formát motívov je v docs/nastavenia.md.
#
# Farby sú pomenované podľa úlohy, nie podľa odtieňa (v svetlom variante je „fg“ tmavé):
#   fg = text, fg-dim = tlmený text, accent = zvýraznenie, on-accent = text na zvýraznení,
#   danger = chyba, base = podklad pred načítaním tapety, terminal / terminal-text = rohové dlaždice
#   lišty, corner-right = pravá rohová dlaždica.
# tint: základná farba a priehľadnosti pre výplne, čiary a obrysy (t1..t4, line-soft, line,
#   outline, outline-strong) a priehľadnosť zvýraznenia (accent).
# panels: [r, g, b, priehľadnosť]; pri vypnutých efektoch priehľadnosti sa použije 1.0.

[theme]
id = "latte"
name = "Latte"
description = "Teplá káva, krémová, karamel. Predvolený motív LatteOS."

[shape]
s = 6
m = 8
l = 10
xl = 12
xxl = 14

[dark.colors]
fg = "#F2EAE0"
fg-dim = "#CDBFAF"
accent = "#D9913B"
on-accent = "#1A1410"
danger = "#E8846B"
base = "#0B0F26"
terminal = "#0B120C"
terminal-text = "#E9F5EC"
corner-right = "#1B1612"

[dark.tint]
base = "#F2EAE0"
t1 = 0.06
t2 = 0.08
t3 = 0.14
t4 = 0.20
line-soft = 0.08
line = 0.10
outline = 0.14
outline-strong = 0.18
accent = 0.36

[dark.panels]
bar = [24, 19, 15, 0.90]
side = [26, 20, 16, 0.68]
list = [32, 25, 20, 0.94]
detail = [28, 22, 17, 0.90]
popup = [22, 18, 14, 0.94]
segment = [20, 16, 13, 0.80]
tabs = [8, 6, 5, 0.5]

[light.colors]
fg = "#2B211A"
fg-dim = "#6B5A4B"
accent = "#A0611A"
on-accent = "#FFFFFF"
danger = "#B5432B"
base = "#E9E0D2"
terminal = "#E4DCCB"
terminal-text = "#1A2A1D"
corner-right = "#E6DDCF"

[light.tint]
base = "#2B211A"
t1 = 0.05
t2 = 0.07
t3 = 0.10
t4 = 0.16
line-soft = 0.08
line = 0.12
outline = 0.16
outline-strong = 0.22
accent = 0.28

[light.panels]
bar = [246, 240, 231, 0.92]
side = [240, 232, 221, 0.72]
list = [250, 246, 239, 0.96]
detail = [244, 238, 229, 0.92]
popup = [250, 246, 240, 0.97]
segment = [245, 239, 230, 0.85]
tabs = [225, 216, 203, 0.6]
