# Strom Nastavení systému podľa návrhu main_setting_v2.md (kap. 58 a 65): päť oblastí + Systém.
# Oblasť (group) je to, čo vidí používateľ; technické domény so schémami (data/settings/<doména>.schema.toml)
# sa do nej mapujú cez stránky. Adresa stránky je settings://oblasť/stránka.
#
# status: ready = stránka funguje, partial = časť, planned = ešte nie je (ukáže sa plán z `contents`).
# etapa = bod z README, ktorý ju dodá. owner = špecializovaný správca, ktorý vlastní operácie.
# sections = ktoré oddiely schémy domény stránka ukazuje (prázdne = všetky).
# view = vlastný obsah stránky v aplikácii (about, storage). launch = čo otvorí „Spravovať v ...“ (files).
# keywords = synonymá pre vyhľadávanie.

[group.software]
title = "Softvér"
description = "Aplikácie, aktualizácie, oprávnenia a súkromie."
[group.data]
title = "Dáta"
description = "Súbory, úložisko, zálohy a synchronizácia."
[group.hardware]
title = "Hardvér"
description = "Obrazovky, zvuk, sieť, zariadenia a napájanie."
[group.account]
title = "Účet"
description = "Kto si, ako sa prihlasuješ a kedy sa obrazovka zamkne."
[group.environment]
title = "Prostredie"
description = "Vzhľad a správanie celého prostredia: motív, písmo, pozadie, okná, lišta."
[group.system]
title = "Systém"
description = "Jazyk, čas, klávesnica, bezpečnosť a informácie o LatteOS."

