# Prompt v lište (hľadať / terminál / AI). Súbor: ~/.config/latteos/prompt.toml (číta latte_common/llm.py).

[domain]
id = "prompt"
title = "Prompt a AI"
description = "Kam sa pripája AI v prompte lišty."
file = "prompt.toml"
owner = "latte-shell"
scope = "user"

[key.ai_url]
type = "string"
default = "http://192.168.56.1:1234"
label = "Adresa servera AI"
description = "LM Studio alebo iný server s API kompatibilným s OpenAI."

[key.ai_model]
type = "string"
default = ""
allow_empty = true
label = "Model"
description = "Prázdne = prvý model, ktorý server ponúka."
