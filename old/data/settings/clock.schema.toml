# Manažér času v lište. Súbor: ~/.config/latteos/clock.toml (zatiaľ ho číta latte_common/clock.py cez prefs).

[domain]
id = "clock"
title = "Čas a dátum"
description = "Pásma, ktoré ukazuje manažér času v lište."
file = "clock.toml"
owner = "latte-shell"
scope = "user"

[key.zones]
type = "string"
default = "Europe/London,America/New_York,Asia/Tokyo"
allow_empty = true
label = "Časové pásma"
description = "Názvy pásiem oddelené čiarkou (Europe/London,Asia/Tokyo). Neplatné sa preskočia."
