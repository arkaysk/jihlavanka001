# Predvolená úroveň vynucovania vzhľadu podľa nástroja, v ktorom je aplikácia napísaná.
# Formát a význam úrovní: src/latte_common/appprofiles.py. Konkrétna aplikácia má vlastný súbor v tomto
# priečinku a prekrýva úroveň nástroja.
# Úrovne "enforced" a "aligned" platia len tam, kde je adaptér naozaj hotový (pozri `latte-appearance status`).

[toolkit.latte]
name = "Komponent LatteOS"
level = "enforced"
note = "Vzhľad kreslí LatteOS sám (latte_common/theme.py), zmena platí hneď."

[toolkit.gtk4]
name = "GTK4 a libadwaita"
level = "aligned"
note = "Režim, akcent a tlačidlá okien cez portál (hneď), farby cez gtk.css. Presný akcent libadwaita zaokrúhli na najbližší štandardný."

[toolkit.gtk3]
name = "GTK 3"
level = "recommended"
fallback = ["frame"]
note = "Farebný režim cez settings.ini. Farby cez gtk.css pripravuje adaptér gtk3 (zatiaľ nie je)."

[toolkit.qt]
name = "Qt"
level = "recommended"
fallback = ["frame"]
note = "Adaptér qt (platformová téma a paleta) je plánovaný."

[toolkit.electron]
name = "Electron a Chromium"
level = "recommended"
fallback = ["frame", "badge"]
note = "Farebný režim z portálu; farby obsahu si aplikácia riadi sama."

[toolkit.firefox]
name = "Firefox"
level = "recommended"
fallback = ["frame", "badge"]
note = "Farebný režim z portálu; politiky a motív pripravuje adaptér firefox."

[toolkit.wine]
name = "Windows aplikácia (Wine)"
level = "unavailable"
fallback = ["compat", "badge"]
note = "Aplikácia kreslí vlastné ovládacie prvky. LatteOS jej dá rám a titulok, obsah nechá."

[toolkit.android]
name = "Android aplikácia (Waydroid)"
level = "unavailable"
fallback = ["compat", "badge"]
note = "Beží vo vlastnej vrstve Androidu. LatteOS jej dá rám a titulok, obsah nechá."

[toolkit.terminal]
name = "Terminál"
level = "recommended"
fallback = ["frame"]
note = "Farby terminálu si riadi jeho nastavenie; LatteOS ich prenesie, ak to aplikácia vie."

[toolkit.unknown]
name = "Neznáma aplikácia"
level = "unavailable"
fallback = ["frame", "badge"]
note = "Nedá sa zistiť, čo aplikácia prevezme; okno dostane rám a značku „vlastný vzhľad“."
