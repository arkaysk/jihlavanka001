# Výber portálových backendov pre desktop LatteOS (XDG_CURRENT_DESKTOP=LatteOS).
# Rovnaké ako labwc-portals.conf z Fedory (wlr pre snímky a zdieľanie obrazovky, Inhibit vypnutý),
# plus náš backend pre Settings: z neho aplikácie berú farebný režim, akcent, písmo a tlačidlá okien.
# Ak by backend nebežal, Settings ide cez gtk.
[preferred]
default=wlr;*
org.freedesktop.impl.portal.Inhibit=none
org.freedesktop.impl.portal.Settings=latteos;gtk
