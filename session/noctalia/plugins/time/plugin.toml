# LatteOS — Čas (ostrov času na lište). Návrh: čas aj dátum na lište; klik otvorí panel s tromi
# záložkami: Čas (časové pásma) · Oznámenia (aj z mobilu) · Kalendár (plánovač + napojenie na kalendáre
# a to-do aplikácie). Účty kalendárov (Google, iCloud, CalDAV, ICS) spravuje kalendár Noctalie.

id          = "latteos/time"
name        = "LatteOS Čas"
version     = "0.1.0"
plugin_api  = 25
author      = "latteos"
license     = "MIT"
dependencies = []
tags        = ["latteos", "clock", "calendar"]
icon        = "clock"
description = "Čas a dátum na lište; panel Čas · Oznámenia · Kalendár s plánovačom udalostí."

[[widget]]
id    = "clock"
entry = "widget.luau"

[[panel]]
id        = "panel"
entry     = "panel.luau"
width     = 420
height    = 640
placement = "floating"
position  = "bottom_left"
