# LatteOS — Text Bar (návrh plochy: „Text Bar“). Jedno pole na lište, štyri režimy prepínané ikonou:
#   Lokálne (funkcie, nastavenia, programy, súbory) · Web · AI · Linux príkaz
# Výsledky zobrazuje spúšťač Noctalie; tento plugin dodáva poskytovateľov výsledkov pre LatteOS.
# Radar: lokálne výsledky bez webu, web až v režime Web; pred deštruktívnym príkazom náhľad a potvrdenie.

id          = "latteos/textbar"
name        = "LatteOS Text Bar"
version     = "0.1.0"
plugin_api  = 25
author      = "latteos"
license     = "MIT"
dependencies = []
tags        = ["latteos", "launcher"]
icon        = "search"
description = "Text Bar LatteOS: režimy Lokálne, Web, AI a Linux príkaz nad spúšťačom Noctalie."

[[widget]]
id    = "bar"
entry = "widget.luau"

# Lokálne: nastavenia a akcie LatteOS aj v bežnom (neprefixovanom) hľadaní
[[launcher_provider]]
id     = "latte"
entry  = "latte.luau"
prefix = "latte"
glyph  = "coffee"
include_in_global_search = true

[[launcher_provider]]
id     = "cmd"
entry  = "cmd.luau"
prefix = "cmd"
glyph  = "terminal-2"

[[launcher_provider]]
id     = "web"
entry  = "web.luau"
prefix = "web"
glyph  = "world"

[[launcher_provider]]
id     = "ai"
entry  = "ai.luau"
prefix = "ai"
glyph  = "sparkles"
debounce_ms = 600
