# LatteOS — maskot na lište („kde mám mačku?“). Vlastná pixel-art (make-mascots.py): Latte mačka,
# čierna Mokka, kávové Zrnko a Ktulu (Cthulhu mačka, chápadlá vyrastajú z lišty). Keď hrá hudba, ťuká labkami
# (štýl bongo cat); inak sedí a žmurká, v noci a pri Nerušiť spí; pri nečinnosti alebo z nudy odíde z ostrova.
# Klik = pohladkať / zavolať späť, pravý klik = ďalší maskot.
# Voľba: ~/.config/latteos/mascot (macka | mokka | zrnko | ktulu | ziadny), mascot-escape (off = neutekať),
# Nastavenia › Prostredie › Lišta.

id          = "latteos/cat"
name        = "LatteOS Maskot"
version     = "0.1.0"
plugin_api  = 32
author      = "latteos"
license     = "MIT"
dependencies = []
tags        = ["latteos", "fun"]
icon        = "cat"
description = "Pixel maskot na lište: ťuká do rytmu hudby, žmurká, v noci spí."

[[widget]]
id    = "mascot"
entry = "mascot.luau"

[widget.actions]
middle = "none"
